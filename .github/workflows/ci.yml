name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test with coverage
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Build web release
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          TURN_SERVER_URL: ${{ secrets.TURN_SERVER_URL }}
          TURN_SERVER_URL_TCP: ${{ secrets.TURN_SERVER_URL_TCP }}
          TURN_SERVER_USERNAME: ${{ secrets.TURN_SERVER_USERNAME }}
          TURN_SERVER_CREDENTIAL: ${{ secrets.TURN_SERVER_CREDENTIAL }}
        run: |
          flutter build web \
            --release \
            --no-pub \
            --base-href=/ \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }} \
            --dart-define=TURN_SERVER_URL=${{ secrets.TURN_SERVER_URL }} \
            --dart-define=TURN_SERVER_URL_TCP=${{ secrets.TURN_SERVER_URL_TCP }} \
            --dart-define=TURN_SERVER_USERNAME=${{ secrets.TURN_SERVER_USERNAME }} \
            --dart-define=TURN_SERVER_CREDENTIAL=${{ secrets.TURN_SERVER_CREDENTIAL }}
